<!DOCTYPE html>
<html lang="ko">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설정 · 물류자동화 통합 계산</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
  }
  :root{
    --bg:#05080F; --surface:#0C1420;
    --border:#1E2A3F;
    --text-primary:#F2F5FA; --text-secondary:#92A1BC; --text-tertiary:#5C6B87;
    --cyan:#00E5D8; --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Pretendard', -apple-system, 'Malgun Gothic', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--text-primary); font-family:var(--sans); }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:640px; margin:0 auto; padding:36px 28px 80px; }
  .back{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:12px; color:var(--text-tertiary);
    margin-bottom:28px;
  }
  .back:hover{ color:var(--cyan); }
  h1{ font-size:26px; font-weight:700; margin-bottom:20px; }
  .panel{
    border:1px solid var(--border); border-radius:12px;
    background:var(--surface); padding:28px 24px;
    text-align:center;
  }
  .panel .tag{
    display:inline-block; font-family:var(--mono); font-size:11px;
    color:var(--cyan); border:1px solid var(--border); border-radius:6px;
    padding:4px 10px; margin-bottom:16px; letter-spacing:0.06em;
  }
  .panel p{ color:var(--text-secondary); font-size:14px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; 메인으로</a>
  <h1>설정</h1>
  <div class="panel">
    <div class="tag">PREPARING</div>
    <p>설정 기능은 아직 준비 중입니다.<br>추후 계산 단위, 기본값, 표시 언어 등의 항목이 이 화면에 추가될 예정입니다.</p>
  </div>
</div>
</body>
</html>
